name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Get PDF books from the "books" release (if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/books/sunnah public/books/silsilah dl
          if gh release view books >/dev/null 2>&1; then
            gh release download books -D dl --pattern '*.pdf' --pattern '*.PDF' || true
            for f in dl/*; do
              [ -f "$f" ] || continue
              n=$(basename "$f")
              case "$(echo "$n" | tr 'A-Z' 'a-z')" in
                silsilah*) mv "$f" public/books/silsilah/ ;;
                *) mv "$f" public/books/sunnah/ ;;
              esac
            done
          else
            echo "No release named 'books' yet - building without release books."
          fi
          ls -la public/books/sunnah public/books/silsilah
      - name: Build web app
        run: |
          npm install
          npm run build
      - name: Create Android project and apply icon
        run: |
          npx cap add android
          cp -r android_branding/res/* android/app/src/main/res/
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          # Store PDFs uncompressed so large books open page by page instead of loading whole
          printf '\nandroid { androidResources { noCompress "pdf" } }\n' >> android/app/build.gradle
      - name: Use the project's fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Mamulat_Yomiya_Private.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mamulat_Yomiya_Private
          path: Mamulat_Yomiya_Private.apk
