/* Layout: a manuscript-like reading column for the routine, with a sticky ledger panel (score, week, sections) beside it on wide screens. */
:root{
  --bg:#f1f3ee; --surface:#fbfcf9; --surface-2:#e8ece4; --line:#d5dbd0;
  --ink:#18221e; --ink-2:#4b5751; --ink-3:#7a857f;
  --accent:#23407a; --accent-ink:#ffffff; --accent-soft:#dfe6f3;
  --done:#2c7a4b; --done-soft:#dcefe2;
  --part:#b07a12; --part-soft:#f6ebcf;
  --miss:#b03d33; --miss-soft:#f5dfdb;
  --star:#c08a12;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.05);
  --f-urdu:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;
  --f-ui:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
  --f-ar:"Amiri","Noto Naskh Arabic",serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1d2723; --line:#2a3631;
  --ink:#e4ebe6; --ink-2:#aab6af; --ink-3:#7d8a83;
  --accent:#9fb6ea; --accent-ink:#0e1412; --accent-soft:#1f2a40;
  --done:#6cc58f; --done-soft:#17301f; --part:#e2b04a; --part-soft:#33290f; --miss:#ec8a80; --miss-soft:#3a1d1a;
  --star:#e2b04a; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1d2723; --line:#2a3631;
  --ink:#e4ebe6; --ink-2:#aab6af; --ink-3:#7d8a83;
  --accent:#9fb6ea; --accent-ink:#0e1412; --accent-soft:#1f2a40;
  --done:#6cc58f; --done-soft:#17301f; --part:#e2b04a; --part-soft:#33290f; --miss:#ec8a80; --miss-soft:#3a1d1a;
  --star:#e2b04a; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num-latin{font-variant-numeric:tabular-nums;font-family:system-ui,sans-serif}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.mark{width:34px;height:34px;flex:none;color:var(--accent)}
.brand h1{margin:0;font-family:var(--f-urdu);font-weight:600;font-size:21px;line-height:1.9;white-space:nowrap}
.brand small{display:block;color:var(--ink-3);font-size:12px;line-height:1.2;margin-top:-4px}
.datebar{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:999px;border:0;background:transparent;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.datelabel{position:relative;padding:0 8px;font-weight:600;font-size:14px;white-space:nowrap;min-width:9.5em;text-align:center}
.datelabel input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.todaybtn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.actions-top{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--miss)}
.btn.small{padding:3px 10px;font-size:13px}

/* Page grid */
.page{max-width:1180px;margin:18px auto 0;display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:980px){.page{grid-template-columns:330px minmax(0,1fr);align-items:start}
  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 90px);overflow:auto;padding-bottom:8px}}
.side{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}

/* Score */
.score{display:flex;gap:16px;align-items:center}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-size:26px;line-height:1;font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ring .val span{display:block;font-size:11px;color:var(--ink-3);margin-top:4px}
.score-txt{min-width:0}
.grade{font-family:var(--f-urdu);font-size:17px;line-height:2;margin:0}
.formula{font-size:12.5px;color:var(--ink-2);margin:0}
.switch{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--ink-2);background:none;border:0;padding:0}
.switch i{width:30px;height:18px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.switch i::after{content:"";position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--ink-3);transition:right .15s}
.switch[aria-checked="true"] i{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"] i::after{right:14px;background:var(--accent)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin:14px 0 8px}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--ink-2)}
.legend div{display:flex;flex-direction:column;align-items:flex-start}
.legend b{font-size:17px;color:var(--ink);font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;line-height:1.3}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;vertical-align:middle}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* History */
.hist{display:flex;gap:3px;align-items:flex-end;height:64px;direction:ltr}
.hist button{flex:1;border:0;padding:0;background:var(--surface-2);border-radius:3px 3px 0 0;position:relative;min-width:0;height:100%}
.hist button i{position:absolute;inset:auto 0 0 0;background:var(--done);border-radius:3px 3px 0 0;display:block}
.hist button.sel{outline:2px solid var(--accent);outline-offset:1px}
.hist button.empty i{background:transparent}
.hist-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:4px;direction:ltr}
.hist-stats{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.hist-stats b{color:var(--ink);font-family:system-ui,sans-serif}

/* Section nav */
.secnav{display:flex;flex-direction:column;gap:2px}
.secnav button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;text-align:right;border:0;background:transparent;border-radius:8px;padding:5px 8px;font-size:14px}
.secnav button:hover{background:var(--surface-2)}
.secnav button.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.secnav .mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums}
.minibar{width:42px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;display:inline-block}
.minibar i{display:block;height:100%;background:var(--done)}

/* Toolbar */
.main{min-width:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 12px;min-width:0}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.search input{border:0;background:transparent;outline:none;padding:8px 0;width:100%;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{font-family:system-ui,sans-serif;font-size:11.5px;opacity:.75;margin-right:4px}
.catchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:thin}
@media (min-width:980px){.catchips{display:none}}

.editbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:13.5px}

/* Sections & items */
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:10px;padding:6px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sec-h h3{margin:0;font-family:var(--f-urdu);font-weight:600;font-size:19px;line-height:2.1;flex:1;min-width:0}
.sec-h .prog{font-size:12.5px;color:var(--ink-3);font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-h .collapse{transition:transform .15s}
.sec.closed .collapse{transform:rotate(90deg)}
.sec.closed .sec-body{display:none}
.sec-h input{flex:1;min-width:0;font-family:var(--f-urdu);font-size:17px;line-height:2;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sec-body{display:flex;flex-direction:column;gap:8px}

.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;position:relative}
.item::before{content:"";position:absolute;inset-block:10px;right:-1px;width:3px;border-radius:3px;background:transparent}
.item[data-st="y"]::before{background:var(--done)}
.item[data-st="p"]::before{background:var(--part)}
.item[data-st="n"]::before{background:var(--miss)}
.item .n{font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-3);text-align:center;padding-top:8px}
.txt{margin:0;font-family:var(--f-urdu);font-size:16.5px;line-height:2.35;word-wrap:break-word}
.txt .ar{font-family:var(--f-ar);font-size:1.14em;line-height:1.9;color:var(--accent)}
.txt mark{background:var(--part-soft);color:inherit;border-radius:3px}
.item[data-st="y"] .txt{color:var(--ink-2)}
.ref{display:inline-block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ref::before{content:"حوالہ: "}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg);gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.seg button svg{width:14px;height:14px}
.seg button[data-v="y"][aria-pressed="true"]{background:var(--done);color:#fff}
.seg button[data-v="p"][aria-pressed="true"]{background:var(--part);color:#fff}
.seg button[data-v="n"][aria-pressed="true"]{background:var(--miss);color:#fff}
.seg button[aria-pressed="false"]:hover{background:var(--surface-2)}
.itools{display:flex;gap:2px}
.itools .iconbtn{width:30px;height:30px}
.itools .iconbtn svg{width:16px;height:16px}
.itools .iconbtn.on{color:var(--star)}
.itools .iconbtn.has{color:var(--accent)}
.notebox{margin-top:8px}
.notebox textarea,.ed textarea,.ed input,.ed select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 10px}
.notebox textarea{font-size:14px;min-height:56px;resize:vertical}

/* Edit mode */
.ed{display:grid;gap:8px}
.ed textarea{font-family:var(--f-urdu);font-size:15px;line-height:2.2;min-height:96px;resize:vertical}
.ed .edrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ed .edrow input{flex:1 1 160px;font-size:13.5px}
.ed .edrow select{flex:0 1 220px;width:auto;font-size:13.5px}
.addbtn{border:1px dashed var(--ink-3);background:transparent;border-radius:var(--r);padding:10px;color:var(--ink-2);font-weight:600;width:100%}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r)}

/* Overlay / modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,15,13,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;border:1px solid var(--line);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:18px;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.modal-h h4{margin:0;font-size:16px}
.imgwrap{background:#fff;border-radius:10px;padding:10px;border:1px solid var(--line)}
.imgwrap img{display:block;width:100%;height:auto}
.sharetext{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font-size:14px;line-height:1.8}
.menu-list{display:grid;gap:8px}
.menu-list .btn{justify-content:flex-start;border-radius:10px;padding:10px 14px}
.muted{color:var(--ink-3);font-size:12.5px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.cloud i{background:var(--done)}

/* Tasbeeh */
.tas{display:grid;place-items:center;gap:10px;text-align:center}
.tas-count{width:180px;height:180px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);font-size:54px;font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:600;display:grid;place-items:center;user-select:none}
.tas-count:active{transform:scale(.98)}
.tas-dhikr{font-family:var(--f-ar);font-size:24px;line-height:1.8}
.tas select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px 10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:70;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){
  .brand small{display:none}
  .datebar{order:3;flex:1 1 100%;justify-content:space-between}
  .item{grid-template-columns:26px minmax(0,1fr);padding:10px 10px 8px;gap:6px}
  .txt{font-size:15.5px}
  .seg button{padding:3px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M20 3l4.6 6.9 8.1-1.6-1.6 8.1L38 20l-6.9 4.6 1.6 8.1-8.1-1.6L20 38l-4.6-6.9-8.1 1.6 1.6-8.1L2 20l6.9-4.6-1.6-8.1 8.1 1.6z"/>
        <path d="M25 14.5a7 7 0 1 0 0 11 5.6 5.6 0 1 1 0-11z" fill="currentColor" stroke="none"/>
      </svg>
      <div><h1>معمولاتِ یومیہ</h1><small id="subtitle"></small></div>
    </div>
    <div class="datebar" role="group" aria-label="تاریخ">
      <button class="iconbtn" id="prevDay" title="پچھلا دن" aria-label="پچھلا دن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
      <label class="datelabel"><span id="dateText"></span><input type="date" id="dateInput" aria-label="تاریخ منتخب کریں"></label>
      <button class="todaybtn" id="todayBtn" hidden>آج</button>
      <button class="iconbtn" id="nextDay" title="اگلا دن" aria-label="اگلا دن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div class="actions-top">
      <button class="btn" id="editBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>ترمیم</span></button>
      <button class="iconbtn" id="menuBtn" aria-label="مزید" title="مزید"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
  </div>
</header>

<div class="page">
  <aside class="side" id="side">
    <section class="panel" aria-label="آج کا خلاصہ">
      <div class="score">
        <div class="ring">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" stroke="var(--surface-2)" stroke-width="9" fill="none"/><circle id="ringArc" cx="50" cy="50" r="42" stroke="var(--done)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9" style="transition:stroke-dashoffset .4s"/></svg>
          <div class="val"><div><b id="pct">0%</b><span id="pctSub">مکمل</span></div></div>
        </div>
        <div class="score-txt">
          <p class="grade" id="grade"></p>
          <p class="formula" id="formula"></p>
          <button class="switch" id="weightBtn" role="switch" aria-checked="false"><i></i>جزوی کو آدھا شمار کریں</button>
        </div>
      </div>
      <div class="bar" id="bar" aria-label="حالات کی تقسیم"></div>
      <div class="legend" id="legend"></div>
      <div class="panel-actions">
        <button class="btn small primary" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>خلاصہ شیئر کریں</button>
        <button class="btn small" id="clearDayBtn">دن صاف کریں</button>
      </div>
    </section>
    <section class="panel" aria-label="پچھلے ۳۰ دن">
      <h2>پچھلے ۳۰ دن</h2>
      <div class="hist" id="hist"></div>
      <div class="hist-axis"><span id="histFrom"></span><span id="histTo"></span></div>
      <div class="hist-stats" id="histStats"></div>
    </section>
    <section class="panel" id="secPanel" aria-label="زمرے" hidden>
      <h2>زمرے</h2>
      <div class="secnav" id="secnav"></div>
    </section>
    <button class="sheet-close" id="sheetClose">بند کریں</button>
  </aside>

  <main class="main" id="mainContent">
    <button class="todaybar" id="todayBar" aria-label="آج کا خلاصہ کھولیں">
      <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--surface-2)" stroke-width="4"/><circle id="miniArc" cx="18" cy="18" r="15" fill="none" stroke="var(--done)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="94.25" style="transition:stroke-dashoffset .4s"/></svg>
      <span class="tb-text"><b id="tbCount">0 / 0</b><small id="tbLabel">آج کے معمولات مکمل</small></span>
      <span class="tb-more">خلاصہ ›</span>
    </button>
    <section class="hero" aria-label="روزانہ رہنمائی">
      <div class="hero-decoration" aria-hidden="true"><svg viewBox="0 0 220 220" fill="none"><path d="M110 12l25 57 61-15-32 55 44 43-62 1-36 55-25-58-61 15 32-55L12 67l63-1z" stroke="currentColor" stroke-width="1.1"/><circle cx="110" cy="110" r="66" stroke="currentColor" stroke-width="1.1"/><circle cx="110" cy="110" r="36" stroke="currentColor" stroke-width="1.1"/></svg></div>
      <div class="hero-intro"><div class="eyebrow"><span class="spark">✦</span> <span id="heroDate"></span></div>
        <h2>ہر دن ایک بہتر قدم</h2>
        <p>معمولات کا جائزہ لیں، چھوٹی کامیابیاں محفوظ کریں اور اگلے عمل پر توجہ دیں۔</p>
      </div>
      <div class="hero-metrics" aria-label="روزانہ پیش رفت">
        <div><strong id="heroDone" class="num-latin">0</strong><span>مکمل</span></div>
        <div><strong id="heroPending" class="num-latin">0</strong><span>توجہ طلب</span></div>
        <div><strong id="heroNA" class="num-latin">0</strong><span>لاگو نہیں</span></div>
      </div>
      <div class="hero-bottom">
        <div class="next-preview"><span>اگلا قدم</span><p id="nextPreview">...</p></div>
        <div class="hero-ctas"><button class="btn hero-primary" id="focusBtn"><span>◎</span> فوکس موڈ</button><button class="btn hero-outline" id="remainingBtn">باقی دیکھیں <span>←</span></button></div>
      </div>
    </section>

    <div class="editbar" id="editbar" hidden>
      <span id="editHint"></span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn small danger" id="resetListBtn">اصل فہرست بحال کریں</button>
        <button class="btn small primary" id="doneEditBtn">ترمیم مکمل</button>
      </span>
    </div>
    <div class="catchips" id="catchips"></div>
    <div class="category-chooser"><label for="categorySelect">زمرہ منتخب کریں</label><select id="categorySelect" aria-label="زمرہ منتخب کریں"></select></div>
    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="تلاش کریں: الفاظ، حوالہ یا نمبر"></label>
      <div class="chips" id="statusChips"></div>
      <button class="btn small utility-btn" id="collapseAllBtn" title="تمام زمرے کھولیں یا بند کریں">زمرے بند کریں</button>
      <button class="btn small utility-btn" id="resetFiltersBtn" hidden>فلٹر صاف کریں</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="undo-toast" id="undoToast" hidden role="status" aria-live="polite"><span id="undoText">تبدیلی محفوظ ہوگئی</span><button id="undoBtn">واپس کریں</button></div>
<nav class="mobile-dock" aria-label="فوری نیویگیشن">
  <button data-bnav="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span>آج</span></button>
  <button data-bnav="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 7h12M8 12h12M8 17h12M3.5 7h.01M3.5 12h.01M3.5 17h.01"/></svg><span>باقی</span></button>
  <button data-bnav="focus" class="dock-focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>فوکس</span></button>
  <button data-bnav="star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg><span>پسندیدہ</span></button>
  <button data-bnav="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>مزید</span></button>
</nav>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script type="module" src="/src/main.js"></script>

</body></html>
